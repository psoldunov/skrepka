#:schema https://www.ensemblr.dev/schemas/settings.schema.json

# Skrepka is a SwiftPM package, not an Xcode project: there is no scheme and no
# dev server. Every button below is a script, and every script branches on the
# OS it runs on, because this file has no per-platform keys and the same
# workspace buttons appear on a Mac and on a Linux box:
#
#   macOS  the same `swift` toolchain and .build directory scripts/doctor.sh
#          uses, with DEVELOPER_DIR pinned.
#   Linux  the Linux targets, through scripts/linux-env.sh — a native Swift 6.3,
#          the nix sandbox nix/dev-env.nix builds, or the build image — into
#          .build-linux. bundle and notarize refuse to run there.

[environment_variables]
# scripts/doctor.sh, scripts/bundle.sh and scripts/setup.sh already default to
# this path; stating it here is meant to make the raw `swift`/`xcrun` buttons
# agree with them. `xcode-select -p` points at CommandLineTools, whose toolchain
# ships no libSwiftDataMacros.dylib (it lives only under Xcode's
# MacOSX.platform), so an unpinned `swift build` fails on every @Model in
# Sources/SkrepkaCore/Store/ — and a SwiftPM scratch directory keyed to a
# different toolchain forces a full rebuild on every switch, which is what makes
# mixed buttons feel so slow. README.md already states Xcode 26 is required.
#
# WHY EVERY COMMAND STILL PINS IT: as of Ensemblr's current build this table
# does not reach terminals. Reproduced in a workspace terminal —
#
#   echo "DD=[$DEVELOPER_DIR] WS=[$ENSEMBLR_WORKSPACE_NAME] PORT=[$ENSEMBLR_PORT]"
#   DD=[] WS=[fix-setup-build-errors] PORT=[41686]
#
# — so the file is parsed (the run scripts below all appear, and the reserved
# ENSEMBLR_* variables are injected) but this table is not applied. Do not
# delete the row: it is correct, and it starts working the day that is fixed.
# Until then every command below pins the toolchain itself.
DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer"

[scripts]
# A fresh worktree starts with no .build/ (it is gitignored, so nothing is
# carried over). Resolve the pinned graph in Package.resolved, then warm the
# debug build so the first Doctor or Test press is incremental. A cold debug
# build measures ~13s on a Mac and ~50s on Linux; the very first Linux setup
# under nix also downloads the Swift toolchain, about 1 GB.
#
# A script, not an inline `swift package resolve && swift build`, so it pins
# DEVELOPER_DIR on a Mac and picks the Linux toolchain on Linux.
setup = "scripts/setup.sh"

# Every script here contends on the one .build directory, and Periphery builds
# the package a third time. Serialise rather than have concurrent SwiftPM
# invocations block on the package lock with interleaved output.
run_mode = "nonconcurrent"

# Deliberately off. The default script launches the real app bundle, which
# prompts for Accessibility; that should be a decision, not a side effect of
# creating a workspace.
auto_run_after_setup = false

[scripts.run.run]
# macOS: build, bundle, sign and launch. Launching via this script rather than
# executing the binary matters: TCC attributes permissions to the responsible
# process, so a shell-launched binary inherits the terminal's grants instead of
# exercising the real permission path. Exits as soon as `open` returns.
#
# Linux: scripts/run-linux.sh — skrepkad and skrepka-gui in debug, in the
# foreground, against this session, with the installed copy stepped aside for
# the run and its own data in .build-linux/dev-data.
command = "scripts/run.sh"
icon = "play"
default = true

[scripts.run.doctor]
# The quality gate and the definition of done: format check, lint, build with
# warnings as errors, tests, dead-code scan. On Linux it is
# scripts/doctor-linux.sh, which cannot compile the macOS app target.
command = "scripts/doctor.sh"
icon = "badge-check"

[scripts.run.doctor-fast]
# The mid-edit loop — format, lint and build only, no tests, no Periphery.
command = "scripts/doctor.sh --fast"
icon = "zap"

[scripts.run.test]
# Just the Swift Testing suite, for when the whole gate is too slow to be a
# feedback loop.
command = "scripts/test.sh"
icon = "test-tube"

[scripts.run.format]
# The fixer the format check names when it fails. On a Mac it is Xcode's
# swift-format, pinned: CommandLineTools carries its own, and two versions of it
# disagree about formatting. On Linux, the Linux toolchain's.
command = "scripts/format.sh"
icon = "paintbrush"

[scripts.run.bundle]
# Produce build/Skrepka.app without stopping or relaunching a running instance.
# macOS only.
command = "scripts/bundle.sh"
icon = "package"

[scripts.run.notarize]
# Build, sign with a secure timestamp, submit to Apple's notary service, staple
# the ticket, and leave build/skrepka-macos-universal.zip and .dmg ready to send
# to someone else.
#
# Not part of the edit loop: it costs a round-trip to Apple's timestamp server
# plus a notary submission that usually takes a few minutes. scripts/bundle.sh
# stays fast and unnotarized for local runs; this is the button for a build that
# leaves the machine.
#
# Needs a one-time notarytool keychain profile named `skrepka` — the script
# prints the exact `store-credentials` command when it cannot find one. macOS
# only.
command = "scripts/notarize.sh"
icon = "shield-check"
