<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Skrepka mark: a swirl paperclip, one continuous wire of constant width
  bent through three U-turns. Adapted from a public-domain paperclip on SVG
  Repo, with the two square-cut free ends replaced by semicircular caps so the
  wire terminates the way a real one does.

  This file is the design source. Sources/SkrepkaCore/Branding/PaperclipPath.swift
  carries the same outline as a CGPath and is what the app, the menu bar and the
  icon renderer actually draw; keep the two in step.

  Design box: 1200 x 1200, top-left origin. Wire width 115.81, so each cap is a
  semicircle of radius 57.907.
-->
